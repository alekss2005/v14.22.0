/* ============================================================

const AI=(()=>{
  const W={channel:.30,confirmations:.25,freshness:.15,hasCoords:.10,hardClassifier:.10,hasTarget:.10};
  const LEVELS={critical:.75,high:.55,medium:.35};
  const SPAM_RULES=[
    {re:/(?:підпис|подпишись|join|t\.me\/|https?:\/\/)/i,w:.5,tag:"реклама"},
    {re:/(?:крипт|биткоин|bitcoin|казино|ставк)/i,w:.7,tag:"крипто"},
    {re:/(?:продам|куплю|оренда|аренда)/i,w:.4,tag:"объявление"},
    {re:/(?:жарт|анекдот|мем|прикол)/i,w:.6,tag:"юмор"}
  ];
  const EMPTY_RE=/^\s*$|^(?:\+|\-|\.|,|\?|\!|\s)+$/;
  function moderate(text){
    const t=(text||"").trim();
    if(!t||EMPTY_RE.test(t))return{ok:false,reason:"пустое",spamScore:1};
    if(t.length<8)return{ok:false,reason:"коротко",spamScore:.8};
    let spam=0,tag="";
    for(const r of SPAM_RULES)if(r.re.test(t)){spam+=r.w;tag=tag||r.tag;}
    spam=Math.min(spam,1);
    if(spam>=.5)return{ok:false,reason:tag||"спам",spamScore:spam};
    return{ok:true,reason:"",spamScore:spam};
  }
  function score(ctx){
    const now=Date.now();
    const ageMin=Math.max(0,(now-(ctx.firstSeen||now))/60000);
    const channels=ctx.channels instanceof Set?ctx.channels:new Set(ctx.channels||[]);
    const chWeight=[...channels].reduce((s,c)=>s+channelWeight(c),0);
    const chAvg=channels.size?chWeight/channels.size:0;
    const chScore=Math.min(chAvg/2,1);
    const confScore=Math.min(channels.size/4,1);
    const freshScore=Math.max(0,1-ageMin/30);
    const geoScore=(ctx.place&&ctx.place.lat!=null&&!ctx.place._areaOnly)?1:.3;
    const hardScore=(ctx.cls&&ctx.cls.hard)?1:.4;
    const targetScore=ctx.target?1:.2;
    const total=W.channel*chScore+W.confirmations*confScore+W.freshness*freshScore+W.hasCoords*geoScore+W.hardClassifier*hardScore+W.hasTarget*targetScore;
    let level="low";
    if(total>=LEVELS.critical)level="critical";
    else if(total>=LEVELS.high)level="high";
    else if(total>=LEVELS.medium)level="medium";
    return{total:Math.round(total*100)/100,level};
  }
  const LEVEL_META={
    critical:{color:"#fecaca",bg:"rgba(220,38,38,.35)",border:"#dc2626",label:"КРИТИЧНО"},
    high:{color:"#fed7aa",bg:"rgba(234,88,12,.3)",border:"#ea580c",label:"ВЫСОКАЯ"},
    medium:{color:"#fef08a",bg:"rgba(202,138,4,.3)",border:"#ca8a04",label:"СРЕДНЯЯ"},
    low:{color:"#cbd5e1",bg:"rgba(148,163,184,.2)",border:"#94a3b8",label:"НИЗКАЯ"}
  };
  function badgeHtml(r){
    if(!r)return"";
    const m=LEVEL_META[r.level]||LEVEL_META.low;
    return `<div class="ai-badge" style="background:${m.bg};color:${m.color};border-color:${m.border}">🤖 ${m.label} · ${Math.round(r.total*100)}%</div>`;
  }
  return{score,moderate,badgeHtml,LEVEL_META};
})();

/* v14.22.0: колокольчик — базовый тон 880 Гц + обертоны 1760/2640, эксп. затухание */
function playBell(){
  if(!audioCtx)return;
  const now=audioCtx.currentTime;
  const partials=[
    {freq:880, gain:.30, decay:1.1},
    {freq:1760,gain:.14, decay:.7},
    {freq:2640,gain:.07, decay:.45}
  ];
  for(const p of partials){
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(p.freq,now);
    g.gain.setValueAtTime(.0001,now);
    g.gain.exponentialRampToValueAtTime(p.gain,now+.012);
    g.gain.exponentialRampToValueAtTime(.0001,now+p.decay);
    o.connect(g);g.connect(audioCtx.destination);
    o.start(now);o.stop(now+p.decay+.05);
  }
}
function playAlertSound(){
  if(!CONFIG.SOUND_ENABLED)return;
  const now=Date.now();
  if(now-lastSoundAt<CONFIG.SOUND_COOLDOWN_MS)return;
  lastSoundAt=now;
  if(!audioCtx)initAudio();
  if(!audioCtx)return;
  try{
    if(audioCtx.state==="suspended")audioCtx.resume();
    playBell();
  }catch(e){}
}

const KYIV_AREA_KEYS=(()=>{
  const keys=[];
  for(const area of kyivAreas){
    keys.push({key:area.name.toLowerCase(),area});
    if(area.id)keys.push({key:area.id.toLowerCase(),area});
  }
  const seen=new Set();const uniq=[];
  for(const k of keys){if(seen.has(k.key))continue;seen.add(k.key);uniq.push(k);}
  return uniq.sort((a,b)=>b.key.length-a.key.length);
})();
function findKyivAreaInText(text){
  const low=(text||"").toLowerCase().replace(/[’`´]/g,"'");
  let best=null;
  for(const{key,area}of KYIV_AREA_KEYS){
    if(key.length<3)continue;
    const idx=low.indexOf(key);
    if(idx<0)continue;
    const before=idx>0?low[idx-1]:" ";
    const after=idx+key.length<low.length?low[idx+key.length]:" ";
    if(!(/[^а-яіїєґa-z]/i.test(before)||before===" "))continue;
    if(!(/[^а-яіїєґa-z]/i.test(after)||after===" "))continue;
    if(!best||idx<best.index||(idx===best.index&&key.length>best.length)){
      best={key:"kyiv_area:"+area.id,name:area.name,lat:area.lat,lon:area.lng,index:idx,length:key.length,_kyivArea:area};
    }
  }
  return best;
}

  let best=null,bestD=Infinity;
  for(const o of RUSSIAN_ORIGINS){

function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371,toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function bearingBetween(lat1,lon1,lat2,lon2){
  const φ1=lat1*Math.PI/180,φ2=lat2*Math.PI/180;
  const Δλ=(lon2-lon1)*Math.PI/180;
  const y=Math.sin(Δλ)*Math.cos(φ2);
  const x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
  return( Math.atan2(y,x)*180/Math.PI+360)%360;
}
function destPoint(lat,lon,bearingDeg,distKm){
  const R=6371,br=bearingDeg*Math.PI/180;
  const lat1=lat*Math.PI/180,lon1=lon*Math.PI/180;
  const lat2=Math.asin(Math.sin(lat1)*Math.cos(distKm/R)+Math.cos(lat1)*Math.sin(distKm/R)*Math.cos(br));
  const lon2=lon1+Math.atan2(Math.sin(br)*Math.sin(distKm/R)*Math.cos(lat1),Math.cos(distKm/R)-Math.sin(lat1)*Math.sin(lat2));
  return[lat2*180/Math.PI,lon2*180/Math.PI];
}

function parseAircraftCount(text){
  if(!text)return null;
  let m=text.match(/(\d+)\s*(?:борт|борти|літак|самолет|ед\.|шт\.)/i);
  if(m)return parseInt(m[1],10);
  m=text.match(/(\d+)\s*[хx×]\s*(?:ту-?\s*95|ту-?\s*160|ту-?\s*22)/i);
  if(m)return parseInt(m[1],10);
  m=text.match(/(\d+)\s+(?:ту-?\s*95|ту-?\s*160|ту-?\s*22)/i);
  if(m)return parseInt(m[1],10);
  return null;
}
function parseAltitude(t){
  if(typeof t.altitude==="number")return Math.round(t.altitude);
  if(typeof t.alt==="number")return Math.round(t.alt);
  if(typeof t.height==="number")return Math.round(t.height);
  const text=[t.title,t.explanationShort,t.region,t.locality].filter(Boolean).join(" ");
  if(!text)return null;
  let m=text.match(/(?:висот[аіиою]|высот[аеыою]|на\s+висот[іи]|на\s+высот[е])\s*[:=]?\s*(\d+(?:[.,]\d+)?)\s*(км|km|м|m)\b/i);
  if(m){
    const v=parseFloat(m[1].replace(",","."));
    const unit=m[2].toLowerCase();
    const meters=(unit==="км"||unit==="km")?v*1000:v;
    if(meters>=50&&meters<=20000)return Math.round(meters);
  }
  m=text.match(/(\d{3,5})\s*(?:м|m\b)/i);
  if(m){const v=parseInt(m[1],10);if(v>=50&&v<=20000)return v;}
  m=text.match(/(\d+(?:[.,]\d+)?)\s*(?:км|km)\b/i);
  if(m){const v=parseFloat(m[1].replace(",","."))*1000;if(v>=50&&v<=20000)return Math.round(v);}
  return null;
}
function isFallingMessage(text){return FALLING_RE.test(text||"");}
function formatAlt(alt){if(alt==null)return"";return alt>=1000?(alt/1000).toFixed(1).replace(/\.0$/,"")+" км":alt+" м";}
function formatEta(min){
  if(min<.5)return"< 1 мин";
  if(min<60)return`~${Math.round(min)} мин`;
  const h=Math.floor(min/60),m=Math.round(min%60);
  return`~${h} ч ${m} мин`;
}
function parseEventTime(text,msgDate){
  if(!text)return null;
  const msgMs=msgDate?Date.parse(msgDate):null;
  const msgDateObj=msgMs?new Date(msgMs):null;
  let m=text.match(/(?:^|\s|[оавОАВуУ])\s*(\d{1,2}):(\d{2})(?:\s|$|,|\.|\))/);
  if(m){
    const hh=parseInt(m[1],10),mm=parseInt(m[2],10);
    if(hh>=0&&hh<=23&&mm>=0&&mm<=59&&msgDateObj){
      const d=new Date(msgDateObj);
      d.setHours(hh,mm,0,0);
      if(d.getTime()>msgMs+5*60*1000)d.setDate(d.getDate()-1);
      return d.getTime();
    }
  }
  m=text.match(/(\d{1,3})\s*(?:хв|мин|min)\s*(?:назад|тому|раніше|ранее)/i);
  if(m)return(msgMs||Date.now())-parseInt(m[1],10)*60*1000;
  return null;
}
function parsePlaceAndAltitude(text){
  if(!text)return null;
  let raw=String(text).trim();
  if(!raw||raw.length>60)return null;
  raw=raw.replace(/^[•·\-–—\s]+/,"").replace(/[\s]+$/,"");
  const m=raw.match(/^([А-ЯІЇЄҐа-яіїєґ'’\-][А-ЯІЇЄҐа-яіїєґ'’\-\s]{1,30}?)\s+(\d{1,5})\s*$/i);
  if(!m)return null;
  const placeName=m[1].trim();
  const altRaw=parseInt(m[2],10);
  let alt=null;
  if(altRaw>=500&&altRaw<=15000)alt=altRaw;
  else if(altRaw>=1&&altRaw<=15)alt=altRaw*1000;
  if(!alt)return null;
  const place=findPlaceInText(placeName);
  if(place)return{place,altitude:alt};
  return null;
}
function isJustAltitude(text){
  if(!text)return null;
  const raw=String(text).trim();
  if(raw.length>8)return null;
  const m=raw.match(/^(\d{3,5})\s*$/);
  if(!m)return null;
  const v=parseInt(m[1],10);
  if(v>=500&&v<=15000)return v;
  return null;
}

const GeoIndex={
  raionMap:null,oblastMap:null,
  build(gj,tm){
    const m=new Map();
    for(const f of (gj?.features||[])){
      const k=String(f.properties?.key||"").toLowerCase().trim();
      if(k)m.set(k,f);
    }
    tm(m);
  },
  find(key){
    if(!key)return null;
    const k=String(key).toLowerCase().trim();
    if(this.raionMap?.has(k))return this.raionMap.get(k);
    if(this.oblastMap?.has(k))return this.oblastMap.get(k);
    return null;
  }
};
let lastAlerts=null;
async function loadAlertGeo(signal){
  try{
    const[r,o]=await Promise.all([
      fetch("https://neptun.in.ua/raions.geojson",{signal}).then(x=>x.json()),
      fetch("https://neptun.in.ua/oblasts.geojson",{signal}).then(x=>x.json())
    ]);
    GeoIndex.build(r,m=>GeoIndex.raionMap=m);
    GeoIndex.build(o,m=>GeoIndex.oblastMap=m);
    if(lastAlerts)syncAlertPolygons(lastAlerts);
  }catch(e){if(e.name!=="AbortError")console.warn(e);}
}
const alertPolygons=new Map();
function alertStyle(level){
  const lv=(level||"red").toLowerCase();
  if(lv==="yellow"||lv==="orange")return{color:"#ca8a04",weight:1,opacity:.7,fillColor:"#eab308",fillOpacity:.22};
  return{color:"#b91c1c",weight:1,opacity:.7,fillColor:"#ef4444",fillOpacity:.24};
}
function syncAlertPolygons(alerts){
  if(!alerts)return;
  lastAlerts=alerts;
  if(!GeoIndex.raionMap&&!GeoIndex.oblastMap)return;
  const active=new Map();
  for(const a of (alerts.raions||[])){const k=a.key||a.name;if(k)active.set(String(k).toLowerCase(),{level:a.level||"red",name:a.name});}
  for(const a of (alerts.oblasts||[])){const k=a.key||a.name;if(k)active.set(String(k).toLowerCase(),{level:a.level||"red",name:a.name});}
  for(const[k,layer]of[...alertPolygons])if(!active.has(k)){alertLayer.removeLayer(layer);alertPolygons.delete(k);}
  for(const[k,info]of active){
    const feat=GeoIndex.find(k);
    if(!feat)continue;
    const style=alertStyle(info.level);
    if(alertPolygons.has(k))alertPolygons.get(k).setStyle(style);
    else{
      const layer=L.geoJSON(feat,{style});
      layer.bindPopup(`<b>${esc(info.name||k)}</b>`);
      layer.addTo(alertLayer);
      alertPolygons.set(k,layer);
    }
  }
}

function extractLaunchStage(text){
  if(!text)return[];
  if(NON_AIR_CONTEXT_RE.test(text))return[];
  const cls=CLASSIFIER(text);
  if(!cls||!cls.hard)return[];
  if(cls.isStrategic){
    const isReady=READY_RE.test(text);
    const isLaunch=LAUNCH_RE.test(text)&&!/без\s+пуск|поки\s+що\s+без/i.test(text);
    if(!isReady&&!isLaunch)return[];
    const bases=findStrategicAirbases(text);
    const count=parseAircraftCount(text);
    const list=bases.length>0?bases:[{key:"unknown",name:"аэродром не указан",lat:null,lon:null,region:""}];
    return list.map(b=>({kind:"strategic",key:"strat_"+b.key,name:b.name,region:b.region,lat:b.lat,lon:b.lon,cls,stage:"ready",target:null,count}));
  }
  if(cls.isAwacs)return[{kind:"awacs",key:"awacs",name:"А-50У",region:"",lat:null,lon:null,cls,stage:"takeoff",target:null,count:null}];
  if(OBSERVATION_TYPES.has(cls.type)){
    if(NO_LAUNCH_RE.test(text))return[];
    const observed=getObservedPlace(text);
    const target=getTargetPlace(text);
    const place=observed||target;
    if(!place)return[];
    return[{kind:"observation",key:"obs_"+place.key+"_"+cls.type,name:place.name,region:"",lat:place.lat,lon:place.lon,cls,stage:null,target,count:null}];
  }
  if(NO_LAUNCH_RE.test(text)&&!/пуск\s+вже|пуск\s+підтверджен|пуски\s+підтверджен|ракети\s+в\s+повітрі/i.test(text))return[];
  const hasLaunch=LAUNCH_RE.test(text);
  const hasThreat=THREAT_RE.test(text);
  let stage=null;
  if(hasLaunch)stage="launch";
  else if(hasThreat)stage="threat";
  else{
    if(cls.type==="uav"||cls.type==="geran5"||cls.type==="jet_drone"||cls.type==="recon"||cls.type==="missile")stage="threat";
    else return[];
  }
  if(stage!=="launch"&&(cls.isJetDrone||cls.type==="missile"||cls.type==="banderol"||cls.type==="geran5")){
    if(!ACTION_RE.test(text))return[];
  }
  if(cls.isMig){
    const base=findMigAirbase(text);
    if(!base)return[{kind:"mig",key:"mig_unknown",name:"аэродром не указан",region:"",lat:null,lon:null,cls,stage:"takeoff",target:null}];
    return[{kind:"mig",key:"mig_"+base.key,name:base.name,region:base.region,lat:base.lat,lon:base.lon,cls,stage:"takeoff",target:null}];
  }
  const target=getTargetPlace(text);
  const results=[];
  const origins=findLaunchOriginsInText(text);
  for(const o of origins)results.push({kind:"origin",key:o.key,name:o.name,region:o.region,lat:o.lat,lon:o.lon,cls,stage,target});
  const region=findRegionInText(text);
  if(region&&origins.length===0)results.push({kind:"region",key:region.key,name:region.name,region:region.name,lat:region.lat,lon:region.lon,cls,stage,target});
  return results;
}

function extractPlaceAndType(text){
  if(!text)return null;
  if(NON_AIR_CONTEXT_RE.test(text))return null;
  if(NO_LAUNCH_RE.test(text)&&!/пуск\s+вже|пуск\s+підтверджен|пуски\s+підтверджен|ракети\s+в\s+повітрі/i.test(text))return null;
  const oblastCount=(text.match(/[А-ЯІЇЄҐ][а-яіїєґ]+щин[аиіу]:/gi)||[]).length;
  if(oblastCount>=2)return null;
  const cls=CLASSIFIER(text);
  if(!cls)return null;
  if(cls.isStrategic||cls.isMig||cls.isAwacs)return null;
  if(OBSERVATION_TYPES.has(cls.type))return null;
  const observed=getObservedPlace(text);
  const target=getTargetPlace(text);
  let place=null,isApproach=false;
  if(observed)place=observed;
  else if(target){
    const src=nearestRussianOrigin(target.lat,target.lon);
    let hdg;
    if(src.origin&&src.dist>CONFIG.TRAIL_MIN_ORIGIN_DIST_KM)hdg=bearingBetween(src.origin.lat,src.origin.lon,target.lat,target.lon);
    else hdg=bearingBetween(51.73,36.19,target.lat,target.lon);
    const[lat,lon]=destPoint(target.lat,target.lon,(hdg+180)%360,CONFIG.APPROACH_OFFSET_KM);
    place={key:"approach_"+target.key,name:target.name,lat,lon,index:0,length:0,_approach:true};
    isApproach=true;
  }else{
    const sentences=text.split(/[.!?\n]+/);
    for(const s of sentences){
      const sentence=s.trim();
      if(!sentence)continue;
      if(!cls.re.test(sentence))continue;
      const rawPlace=findPlaceInText(sentence);
      if(rawPlace){
        const idx=text.indexOf(sentence);
        place={key:rawPlace.key,name:rawPlace.name,lat:rawPlace.lat,lon:rawPlace.lon,index:idx+rawPlace.index,length:rawPlace.length,_kyivArea:rawPlace._kyivArea};
        break;
      }
    }
  }
  if(!place)return null;
  const windowStart=Math.max(0,place.index-200);
  const windowEnd=Math.min(text.length,place.index+place.length+200);
  const sentence2=text.slice(windowStart,windowEnd);
  const localPlaceIndex=Math.max(0,place.index-windowStart);
  const typeRegex=new RegExp(cls.re.source,cls.re.flags);
  const typeMatch=typeRegex.exec(sentence2);
  if(!typeMatch)return null;
  const pEnd=localPlaceIndex+place.length;
  const tStart=typeMatch.index;
  const tEnd=tStart+typeMatch[0].length;
  const gap=pEnd<=tStart?(tStart-pEnd):(localPlaceIndex-tEnd);
  if(gap<0||gap>250)return null;
  if(!cls.hard){if(!ACTION_RE.test(sentence2))return null;}
  return{place,cls,target,isApproach};
}

function extractImpact(text){
  if(!text)return null;
  if(NON_AIR_CONTEXT_RE.test(text))return null;
  const oblastCount=(text.match(/[А-ЯІЇЄҐ][а-яіїєґ]+щин[аиіу]:/gi)||[]).length;
  if(oblastCount>=2)return null;
  const impactMatch=IMPACT_RE.exec(text);
  if(!impactMatch)return null;
  const impactIdx=impactMatch.index;
  const place=findPlaceInText(text);
  if(place&&Math.abs(place.index-impactIdx)<=120){
    if(TOO_GENERIC_PLACES.has(place.key)){
      const window=text.slice(Math.max(0,place.index-30),place.index+place.key.length+30);
      if(!/·|район|мікрорайон|масив|берег/i.test(window))return null;
    }
    return{target:{key:place.key,name:place.name,lat:place.lat,lon:place.lon,_kyivArea:place._kyivArea}};
  }
  const region=findRegionInText(text);
  if(region){
    const rm=region.re.exec(text);
    if(rm&&Math.abs(rm.index-impactIdx)<=120)return{target:{key:region.key,name:region.name,lat:region.lat,lon:region.lon}};
  }
  return null;
}

   API-треки

const tracks=new Map();
const lastSoundByPlace={};

function normalizeThreat(t){
  const out={...t};
  const cls=CLASSIFIER([t.type,t.title,t.explanationShort].filter(Boolean).join(" "));
  if(cls?.isGeran5){out.type="geran5";out._geran5=true;out.title=out.title||"Герань-5";}
  else if(cls&&!TYPE_META[t.type])out.type=cls.type;
  out._altitude=parseAltitude(t);
  out._falling=isFallingMessage(t.explanationShort||t.title||"");
  if(typeof t.count==="number"&&t.count>0)out._count=t.count;
  if(typeof t.uncertaintyKm==="number")out.uncertaintyKm=t.uncertaintyKm;
  if(t.advisory===true)out.advisory=true;
  if(t.areaOnly===true)out.areaOnly=true;
  out._speedKmh=resolveSpeedKmh(out.type,[t.title,t.explanationShort].filter(Boolean).join(" "));
  return out;
}
function resolveHeading(t){
  if(t.heading!=null)return t.heading;
  if(t.velocity&&t.velocity.bearingDeg!=null)return t.velocity.bearingDeg;
  return null;
}
function resolveBaseTime(t){
  const iso=t.confirmedAt||t.updatedAt;
  if(iso){const ms=Date.parse(iso);if(!isNaN(ms))return ms;}
  return Date.now();
}
function isStale(bt){return(Date.now()-bt)>CONFIG.STALE_VISUAL_AFTER_HOURS*3600000;}

function upsertThreat(raw){
  try{
    const t=normalizeThreat(raw);
    if(t.lat==null||t.lon==null||t.areaOnly)return;
    if(t.status==="resolved"){removeThreat(t.id,true);return;}
    if(CONFIG.ROCKET_ONLY_KYIV_OBLAST&&CONFIG.ROCKET_WARNING_TYPES.has(t.type)&&!inKyivOblast(t.lat,t.lon)){
      removeThreat(t.id,true);return;
    }
    if(!inZone(t.lat,t.lon)){removeThreat(t.id,true);return;}

    const heading=resolveHeading(t);
    const baseTime=resolveBaseTime(t);
    const existing=tracks.get(t.id);
    const uncertain=(t.uncertaintyKm!=null&&t.uncertaintyKm>CONFIG.UNCERTAIN_KM);
    const advisory=!!t.advisory;
    const areaOnly=!!t.areaOnly;
    const speed=t._speedKmh||CONFIG.FALLBACK_SPEED[t.type]||180;
    const dKyiv=haversineKm(CONFIG.KYIV[0],CONFIG.KYIV[1],t.lat,t.lon);
    const inSirenZone=dKyiv<=CONFIG.SOUND_NEAR_KM;

    if(existing){
      const dOld=haversineKm(CONFIG.KYIV[0],CONFIG.KYIV[1],existing.baseLat,existing.baseLon);
      existing.threat=t;
      existing.baseLat=t.lat;existing.baseLon=t.lon;existing.baseTime=baseTime;
      existing.heading=heading;existing.advisory=advisory;existing.areaOnly=areaOnly;
      existing.uncertain=uncertain;existing.speed=speed;existing.inSirenZone=inSirenZone;
      const st=isStale(baseTime);
      existing.stale=st;
      existing.marker.setIcon(makeIcon(t,heading,false,0,0,existing.eta,st,advisory,areaOnly,uncertain,null,null,inSirenZone));
      existing.marker.setPopupContent(buildThreatPopup(t,existing.eta,st,existing.uncertain));
      if(CONFIG.SOUND_ENABLED&&CONFIG.SOUND_TYPE_FILTER.has(t.type)&&inSirenZone&&dOld>CONFIG.SOUND_NEAR_KM){
        fireSirenForTarget("api:"+t.id,t);
      }
    }else{
      let estHeading=heading;
      if(estHeading==null){
        const launch=nearestLaunch(t.lat,t.lon);
        estHeading=bearingBetween(launch.lat,launch.lon,t.lat,t.lon);
      }
      const st=isStale(baseTime);
      const marker=L.marker([t.lat,t.lon],{icon:makeIcon(t,estHeading,false,0,0,null,st,advisory,areaOnly,uncertain,null,null,inSirenZone)});
      marker.bindPopup(buildThreatPopup(t,null,st,uncertain));
      marker.addTo(threatLayer);
      tracks.set(t.id,{marker,threat:t,baseLat:t.lat,baseLon:t.lon,baseTime,heading:estHeading,eta:null,stale:st,advisory,areaOnly,uncertain,speed,inSirenZone,history:[{lat:t.lat,lon:t.lon,t:baseTime}],trailLine:null,arrivalDone:false});
      if(CONFIG.SOUND_ENABLED&&CONFIG.SOUND_TYPE_FILTER.has(t.type)&&inSirenZone)fireSirenForTarget("api:"+t.id,t);
    }
  }catch(e){console.warn("upsertThreat",e);removeThreat(raw?.id,true);}
}

function fireSirenForTarget(key,clsLike){
  const now=Date.now();
  const last=lastSoundByPlace[key]||0;
  if(now-last<CONFIG.SOUND_NEAR_WINDOW_MS)return false;
  lastSoundByPlace[key]=now;
  playAlertSound();
  return true;
}

function buildThreatPopup(t,eta,stale,uncertain){
  const meta=getMeta(t.type);
  const label=(t._geran5||t.type==="geran5")?"Герань-5":meta.label;
  const loc=[t.locality,t.district,t.region].filter(Boolean).join(", ")||"—";
  const updated=t.updatedAt?new Date(t.updatedAt).toLocaleString("ru-RU"):"—";
  const alt=t._altitude;
  const altLine=alt!=null?`<div class="popup-alt">📍 Висота: <b>${formatAlt(alt)}</b></div>`:"";
  const countLine=t._count?`<br>Бортов: <b>${t._count}</b>`:"";
  const spdLine=t._speedKmh?`<br>Швидкість: <b>${t._speedKmh} км/год</b>`:"";
  const etaLine=(eta!=null&&eta>0)?`<div class="popup-eta">⏱ ~${formatEta(eta)}</div>`:"";
  const staleLine=stale?`<div class="popup-stale">⌛ Данные старше ${Math.round(CONFIG.STALE_VISUAL_AFTER_HOURS*60)} мин</div>`:"";
  const advisoryLine=t.advisory?`<div class="popup-advisory">ℹ Спостереження</div>`:"";
  const areaLine=t.areaOnly?`<div class="popup-area">≈ Точка не указана</div>`:"";
  const uncLine=uncertain?`<div class="popup-guess">⚠ Позиція неточна: ±${t.uncertaintyKm} км</div>`:"";
  const confLine=t.confidenceLevel?`<br>Уверенность: <b>${esc(t.confidenceLevel)}</b>`:"";
  const srcLine=t.sourceCount?`<br>Джерел у API: <b>${t.sourceCount}</b>`:"";
  const tr=tracks.get(t.id);
  let trailLine="";
  if(tr&&tr.history&&tr.history.length>1){
    const pts=tr.history.slice(-CONFIG.API_TRAIL_MAX_POINTS);
    const ptsHtml=pts.map((p,i)=>{
      const time=new Date(p.t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
      return`<div class="pt-point"><span class="pt-num">${i+1}.</span><span class="pt-place">${p.lat.toFixed(3)}, ${p.lon.toFixed(3)}</span><span class="pt-time">${time}</span></div>`;
    }).join("");
    trailLine=`<div class="popup-trail"><div class="pt-title">📍 История позиции:</div>${ptsHtml}</div>`;
  }
  return`
    <div class="popup-title type-${t.type}">${esc(label)}</div>
    <div>${esc(t.explanationShort||t.title||"")}</div>
    ${etaLine}${altLine}${advisoryLine}${areaLine}${staleLine}
    <div class="popup-meta">Місце: ${esc(loc)}${spdLine}${confLine}${countLine}${srcLine}<br>Обновлено: ${updated}</div>
    ${trailLine}${uncLine}
  `;
}
function removeThreat(id,silent){
  const tr=tracks.get(id);
  if(!tr)return;
  try{threatLayer.removeLayer(tr.marker);}catch{}
  if(tr.trailLine)try{map.removeLayer(tr.trailLine);}catch{}
  tracks.delete(id);
}
function syncThreats(list){
  const seen=new Set();
  for(const t of list){seen.add(t.id);upsertThreat(t);}
  for(const id of[...tracks.keys()])if(!seen.has(id))removeThreat(id,true);
}

============================================================ */
const trails=new Map();
function appendTrailPoint(chainKey,cls,point,channel,msgMs){
  let chain=trails.get(chainKey);
  if(chain){
    const last=chain.points[chain.points.length-1];
    const age=msgMs-chain.lastSeen;
    const dist=last?haversineKm(last.lat,last.lon,point.lat,point.lon):0;
    if(age>CONFIG.TRAIL_MAX_AGE_MS||dist>CONFIG.TRAIL_MAX_GAP_KM){closeTrail(chainKey);chain=null;}
  }
  if(!chain){
    chain={cls,points:[],firstSeen:msgMs,lastSeen:msgMs,channels:new Set(),heading:null,markerRef:null,aiResult:null,isGeran5:!!(cls.isGeran5||cls.type==="geran5"),polyline:null,speedKmh:resolveSpeedKmh(cls.type,point.sampleText||"")};
    trails.set(chainKey,chain);
  }
  const last=chain.points[chain.points.length-1];
  if(!last||haversineKm(last.lat,last.lon,point.lat,point.lon)>0.1){
    chain.points.push({...point,t:msgMs,channel});
    if(chain.points.length>CONFIG.TRAIL_MAX_POINTS)chain.points.shift();
  }
  chain.channels.add(channel);
  chain.lastSeen=msgMs;
  if(chain.markerRef&&chain.polyline){
    try{chain.polyline.setLatLngs(chain.points.map(p=>[p.lat,p.lon]));}catch{}
  }
  return chain;
}
function closeTrail(chainKey){
  const chain=trails.get(chainKey);
  if(!chain)return;
  if(chain.markerRef&&chain.markerRef.marker)try{msgThreatLayer.removeLayer(chain.markerRef.marker);}catch{}
  if(chain.polyline)try{map.removeLayer(chain.polyline);}catch{}
  trails.delete(chainKey);
}
function buildTrailPopupHtml(chain){
  const meta=getMeta(chain.cls.type);
  const label=(chain.cls.isGeran5||chain.cls.type==="geran5")?"Герань-5":(meta?meta.label:chain.cls.label);
  const pointsHtml=chain.points.map((p,i)=>{
    const arrow=i<chain.points.length-1?'<span class="pt-arrow">→</span>':'';
    const time=new Date(p.t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
    const ch=p.channel?` <span class="pt-time">@${esc(p.channel)}</span>`:"";
    return`<div class="pt-point"><span class="pt-num">${i+1}.</span><span class="pt-place">${esc(p.name)}</span>${arrow}<span class="pt-time">${time}</span>${ch}</div>`;
  }).join("");

    return`<span class="ch ${cls}">${esc(lbl)}</span>`;
  }).join(" ");
  const aiHtml=chain.aiResult?AI.badgeHtml(chain.aiResult):"";
  const spd=chain.speedKmh?`<br>Швидкість: <b>${chain.speedKmh} км/год</b>`:"";
  return`
    <div class="popup-title type-${chain.cls.type}">${esc(label)}</div>
    <div>Траектория · ${chain.points.length} точек · ${durationMin} мин${spd}</div>
    <div class="popup-trail"><div class="pt-title">📍 Маршрут:</div>${pointsHtml}</div>
    ${aiHtml}
    <div class="popup-channels" style="margin-top:8px"><b>Источники (${chain.channels.size}):</b><br>${channelList}</div>
  `;
}
function openTrail(chainKey){
  const chain=trails.get(chainKey);
  if(!chain||!chain.markerRef||!chain.markerRef.marker)return;
  const latlngs=chain.points.map(p=>[p.lat,p.lon]);
  if(latlngs.length<2)return;
  if(chain.polyline)try{map.removeLayer(chain.polyline);}catch{}
  chain.polyline=L.polyline(latlngs,{color:CONFIG.TRAIL_COLOR,weight:CONFIG.TRAIL_LINE_WIDTH,opacity:.85,dashArray:"6 5",interactive:false}).addTo(map);
  if(chain.markerRef.trailPoints)for(const m of chain.markerRef.trailPoints)try{map.removeLayer(m);}catch{}
  const ptMarkers=[];
  chain.points.forEach((p,i)=>{
    const m=L.marker([p.lat,p.lon],{
      icon:L.divIcon({
        className:"",
        html:`<div style="background:#dc2626;color:#fff;font-size:9px;font-weight:800;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;border:1px solid #fff">${i+1}</div>`,
        iconSize:[16,16],iconAnchor:[8,8]
      }),
      interactive:false
    }).addTo(map);
    ptMarkers.push(m);
  });
  chain.markerRef.trailPoints=ptMarkers;
}
function closeTrailDrawing(chainKey){
  const chain=trails.get(chainKey);
  if(!chain)return;
  if(chain.polyline)try{map.removeLayer(chain.polyline);}catch{}
  chain.polyline=null;
  if(chain.markerRef&&chain.markerRef.trailPoints){
    for(const m of chain.markerRef.trailPoints)try{map.removeLayer(m);}catch{}
    chain.markerRef.trailPoints=null;
  }
}
map.on("popupclose",()=>{for(const key of trails.keys())closeTrailDrawing(key);});

   Синхронизация сообщений
============================================================ */
const msgMarkers=new Map();
const impactMarkers=new Map();
const lastPlaceByChannel={};

function maybeSirenForPlace(key,cls,lat,lon){
  if(!CONFIG.SOUND_ENABLED)return;
  if(!CONFIG.SOUND_TYPE_FILTER.has(cls.type))return;
  if(lat==null||lon==null)return;
  const d=haversineKm(CONFIG.KYIV[0],CONFIG.KYIV[1],lat,lon);
  if(d>CONFIG.SOUND_NEAR_KM)return;
  fireSirenForTarget("msg:"+key,cls);
}

function simulateMovement(o){
  if(!o||!o.marker)return;
  if(o._simulated)return;
  o._simulated=true;
  const chain=o.chainKey?trails.get(o.chainKey):null;
  if(!chain)return;
  const speed=o.speedKmh||resolveSpeedKmh(o.cls.type,"");
  const heading=(o.heading!=null)?o.heading:null;
  if(heading==null)return;
  const startLL=o.marker.getLatLng();
  const bearingToKyiv=bearingBetween(startLL.lat,startLL.lng,CONFIG.KYIV[0],CONFIG.KYIV[1]);
  const headingDiff=Math.abs(((heading-bearingToKyiv+540)%360)-180);
  if(headingDiff>90)return;
  const kmPerSec=speed/3600;
  o._simTimer=setInterval(()=>{
    if(!o.marker){clearInterval(o._simTimer);return;}
    const ll=o.marker.getLatLng();
    const d=haversineKm(ll.lat,ll.lng,CONFIG.KYIV[0],CONFIG.KYIV[1]);
    if(d<=CONFIG.SOUND_NEAR_KM&&!o._sirenFired){
      o._sirenFired=true;
      maybeSirenForPlace(o.chainKey||("sim"+Math.random()),o.cls,ll.lat,ll.lng);
    }
    if(d<1){
      clearInterval(o._simTimer);
      spawnImpact(ll,o.cls);
      try{msgThreatLayer.removeLayer(o.marker);}catch{}
      if(o.chainKey){msgMarkers.delete(o.chainKey);closeTrail(o.chainKey);}
      return;
    }
    const[nlat,nlon]=destPoint(ll.lat,ll.lng,bearingToKyiv,kmPerSec);
    o.marker.setLatLng([nlat,nlon]);
    const ch=o.chainKey?trails.get(o.chainKey):null;
    if(ch){
      const last=ch.points[ch.points.length-1];
      if(!last||haversineKm(last.lat,last.lon,nlat,nlon)>0.5){
        ch.points.push({lat:nlat,lon:nlon,t:Date.now(),name:"→ Київ"});
        if(ch.points.length>CONFIG.TRAIL_MAX_POINTS)ch.points.shift();
        if(ch.polyline)try{ch.polyline.setLatLngs(ch.points.map(p=>[p.lat,p.lon]));}catch{}
      }
    }
  },1000);
}

function spawnImpact(latlng,cls){

  const now=Date.now();

    <div class="popup-meta">Прилёт в ${latlng.lat.toFixed(3)}, ${latlng.lng.toFixed(3)}<br>Время: ${new Date(now).toLocaleTimeString("ru-RU")}</div>`);

    try{impactLayer.removeLayer(marker);}catch{}

}

function syncMessageThreats(messages){
  const now=Date.now();
  const candidates=new Map();
  const impacts=new Map();

  for(let i=0;i<(messages||[]).length;i++){
    const m=messages[i];
    const text=m.text||"";
    const ch=(m.channel||"unknown").replace(/^@/,"").toLowerCase();
    const msgMs=m.date?Date.parse(m.date):now;
    const mod=AI.moderate(text);
    if(!mod.ok)continue;

    const warns=detectThreatWarnings(text);
    for(const w of warns){
      const key="warn:"+w.id;
      if(!candidates.has(key))candidates.set(key,{kind:"warning",warning:w,channels:new Set(),firstSeen:msgMs,lastSeen:msgMs,sampleText:text});
      const c=candidates.get(key);
      c.channels.add(ch);
      if(msgMs<c.firstSeen)c.firstSeen=msgMs;
      if(msgMs>c.lastSeen)c.lastSeen=msgMs;
      if(text.length<c.sampleText.length)c.sampleText=text;
    }

    const isAltCh=isAltitudeChannel(ch);
    if(isAltCh){
      const pa=parsePlaceAndAltitude(text);
      if(pa){
        const key="pa|"+pa.place.key;
        if(!candidates.has(key))candidates.set(key,{kind:"place",place:pa.place,cls:{type:"uav",label:"БПЛА",hard:false},target:null,altitudeOverride:pa.altitude,channels:new Set(),firstSeen:msgMs,lastSeen:msgMs,sampleText:text});
        const c=candidates.get(key);
        c.channels.add(ch);
        if(msgMs<c.firstSeen)c.firstSeen=msgMs;
        if(msgMs>c.lastSeen)c.lastSeen=msgMs;
        c.altitudeOverride=pa.altitude;c.sampleText=text;
        lastPlaceByChannel[ch]=key;
        continue;
      }
      const justAlt=isJustAltitude(text);
      if(justAlt!=null){
        const lastKey=lastPlaceByChannel[ch];
        if(lastKey&&candidates.has(lastKey)){
          const c2=candidates.get(lastKey);
          c2.altitudeOverride=justAlt;c2.lastSeen=msgMs;c2.channels.add(ch);
        }
        continue;
      }
    }

    const launches=extractLaunchStage(text);
    if(launches.length>0){
      for(const L of launches){
        const key=`reg|${L.key}|${L.cls.type}|${L.stage||"obs"}`;
        if(!candidates.has(key))candidates.set(key,{kind:L.kind,origin:L,cls:L.cls,stage:L.stage,region:{key:L.key,name:L.name,lat:L.lat,lon:L.lon},target:L.target,count:L.count||null,channels:new Set(),firstSeen:msgMs,lastSeen:msgMs,sampleText:text});
        const c=candidates.get(key);
        c.channels.add(ch);
        if(msgMs<c.firstSeen)c.firstSeen=msgMs;
        if(msgMs>c.lastSeen)c.lastSeen=msgMs;
        if(text.length<c.sampleText.length)c.sampleText=text;
        if(L.count&&(!c.count||L.count>c.count))c.count=L.count;
      }
      continue;
    }

    const extracted=extractPlaceAndType(text);
    if(extracted){
      const{place,cls,target,isApproach}=extracted;
      const key=`msg|${place.key}|${cls.type}`;
      if(!candidates.has(key))candidates.set(key,{kind:"place",place,cls,target,isApproach:!!isApproach,channels:new Set(),firstSeen:msgMs,lastSeen:msgMs,sampleText:text});
      const c=candidates.get(key);
      c.channels.add(ch);
      if(msgMs<c.firstSeen)c.firstSeen=msgMs;
      if(msgMs>c.lastSeen)c.lastSeen=msgMs;
      if(text.length<c.sampleText.length)c.sampleText=text;
      continue;
    }

    const impact=extractImpact(text);
    if(impact){
      const key=`imp|${impact.target.key}`;
      if(!impacts.has(key))impacts.set(key,{target:impact.target,channels:new Set(),eventAt:null,lastSeen:msgMs,sampleText:text});
      const c=impacts.get(key);
      c.channels.add(ch);
      const evt=parseEventTime(text,m.date);
      if(evt&&(!c.eventAt||evt>c.eventAt))c.eventAt=evt;
      if(msgMs<c.lastSeen)c.lastSeen=msgMs;
      if(text.length<c.sampleText.length)c.sampleText=text;
    }
  }

  for(const[key,c]of candidates){
    if(c.kind==="warning"){
      const confirmN=c.channels.size;
      if(confirmN<1)continue;
      const age=now-c.firstSeen;
      if(age>CONFIG.STALE_MSG_MS*3)continue;
      const w=c.warning;
      const firstRegion=w.regions[0];
      const rg=REGIONS.find(r=>r.name.toLowerCase().includes(firstRegion.toLowerCase().split(" ")[0]))
              ||LAUNCH_AREAS.find(r=>r.name.toLowerCase().includes(firstRegion.toLowerCase().split(" ")[0]))
              ||{lat:CONFIG.KYIV[0],lon:CONFIG.KYIV[1],name:firstRegion};
      if(rg.lat==null)continue;
      const marker=L.marker([rg.lat,rg.lon],{
        icon:L.divIcon({
          className:"",
          html:`<div style="position:relative;width:32px;height:32px">
            <div style="font-size:24px;line-height:1;filter:drop-shadow(0 0 8px ${w.color});animation:impactPop 1.2s ease-in-out infinite">⚠️</div>
          </div>`,
          iconSize:[32,32],iconAnchor:[16,16],popupAnchor:[0,-16]
        }),
        zIndexOffset:970
      });
      const warnList=`<ul class="popup-warning-list">${w.regions.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`;
      marker.bindPopup(`
        <div class="popup-title" style="color:${w.color}">${esc(w.label)}</div>
        <div class="popup-warning">${esc(w.detail)}</div>
        <div class="popup-meta" style="margin-top:6px">Регионы:<br>${warnList}</div>
        <div class="popup-meta">Подтверждений: <b>${confirmN}</b></div>
        ${channelsListHtml(c.channels)}
      `);
      marker.addTo(msgThreatLayer);
      if(msgMarkers.has(key)){const _old=msgMarkers.get(key);if(_old.marker)msgThreatLayer.removeLayer(_old.marker);}
      msgMarkers.set(key,{marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,cls:{type:"warning",label:"WARN"},place:{name:firstRegion,lat:rg.lat,lon:rg.lon},warning:w,isWarning:true});
      continue;
    }

    const confirmN=c.channels.size;
    const totalW=totalWeightOf(c.channels);
    const isThreatSolo=c.stage==="threat"&&confirmN<CONFIG.MIN_CHANNELS_CONFIRM;
    const isMig=c.cls&&c.cls.isMig;
    const isStrategic=c.cls&&c.cls.isStrategic;
    const isAwacs=c.cls&&c.cls.isAwacs;
    const isObservation=c.cls&&OBSERVATION_TYPES.has(c.cls.type);
    const age=now-c.firstSeen;
    const isAltitudeMsg=c.altitudeOverride!=null;
    if(isStrategic){if(confirmN<1)continue;}
    else if(isMig){if(confirmN<1)continue;if(age>CONFIG.STALE_MSG_MS)continue;}
    else if(isAwacs)continue;
    else if(isAltitudeMsg){if(age>CONFIG.STALE_MSG_MS)continue;}
    else if(isObservation){if(confirmN<CONFIG.MIN_CHANNELS_CONFIRM)continue;if(age>CONFIG.STALE_MSG_MS)continue;}
    else if(isThreatSolo){if(age>CONFIG.LAUNCHER_SOLO_TTL_MS)continue;}
    else if(confirmN<CONFIG.MIN_CHANNELS_CONFIRM)continue;
    else if(totalW<2.0)continue;
    if(CONFIG.ROCKET_ONLY_KYIV_OBLAST&&c.cls&&CONFIG.ROCKET_WARNING_TYPES.has(c.cls.type)&&c.place&&!inKyivOblast(c.place.lat,c.place.lon))continue;
    if(CONFIG.ROCKET_ONLY_KYIV_OBLAST&&c.cls&&CONFIG.ROCKET_WARNING_TYPES.has(c.cls.type)&&c.region&&!inKyivOblast(c.region.lat,c.region.lon))continue;

    const aiResult=AI.score({channels:c.channels,firstSeen:c.firstSeen,place:c.place||c.region,cls:c.cls,target:c.target});

    if(c.kind==="strategic"){
      const{region,cls,origin,count}=c;
      if(region.lat!=null&&region.lon!=null){
        const zoneOk=inZone(region.lat,region.lon)||CONFIG.STRAT_SHOW_OUTSIDE_ZONE;
        if(!zoneOk)continue;
        const fakeThreat={type:cls.type,_altitude:null,_falling:false,_stage:"ready",_count:count||null,heading:null};
        const marker=L.marker([region.lat,region.lon],{icon:makeIcon(fakeThreat,null,false,confirmN,totalW,null,false,false,false,false,aiResult.level,"ready",false),zIndexOffset:930});
        marker.bindPopup(`<div class="popup-title type-${cls.type}">Стратегічна авіація · готовність</div><div>${esc(c.sampleText.slice(0,220))}</div><div class="popup-meta"><b>${esc(origin.name)}</b> (${esc(origin.region)})${count?`<br>Бортов: <b>${count}</b>`:""}<br>Подтверждений: <b>${confirmN}</b></div>${channelsListHtml(c.channels)}${aiResult?AI.badgeHtml(aiResult):""}`);
        marker.addTo(msgThreatLayer);
        if(msgMarkers.has(key)){const _old=msgMarkers.get(key);if(_old.marker)msgThreatLayer.removeLayer(_old.marker);}
        msgMarkers.set(key,{marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,cls,place:{name:origin.name,lat:region.lat,lon:region.lon},isRegion:true,stage:"ready"});
      }
      continue;
    }
    if(c.kind==="mig"){
      const{region,cls,origin}=c;
      if(region.lat==null||region.lon==null)continue;
      const zoneOk=inZone(region.lat,region.lon)||CONFIG.MIG_SHOW_OUTSIDE_ZONE;
      if(!zoneOk)continue;
      const marker=L.marker([region.lat,region.lon],{icon:makeIcon(cls,null,false,confirmN,totalW,null,false,false,false,false,aiResult.level,"takeoff",false),zIndexOffset:935});
      marker.bindPopup(`<div class="popup-title type-${cls.type}">МиГ-31К · взлёт</div><div>${esc(c.sampleText.slice(0,220))}</div><div class="popup-meta"><b>${esc(origin.name)}</b> (${esc(origin.region)})<br>Подтверждений: <b>${confirmN}</b></div>${channelsListHtml(c.channels)}${aiResult?AI.badgeHtml(aiResult):""}`);
      marker.addTo(msgThreatLayer);
      if(msgMarkers.has(key)){const _old=msgMarkers.get(key);if(_old.marker)msgThreatLayer.removeLayer(_old.marker);}
      msgMarkers.set(key,{marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,cls,place:{name:origin.name,lat:region.lat,lon:region.lon},isRegion:true,stage:"takeoff"});
      continue;
    }
    if(c.kind==="observation"){
      const{cls,target}=c;
      const place=c.origin||c.region;
      const src=DEFAULT_SOURCES[cls.type];
      let arrowBearing=0;
      if(target)arrowBearing=bearingBetween(place.lat,place.lon,target.lat,target.lon);
      else if(src)arrowBearing=(bearingBetween(place.lat,place.lon,src.lat,src.lon)+180)%360;
      const chainKey=`${cls.type}|obs|${(target&&target.key)||place.key}`;
      const chain=appendTrailPoint(chainKey,cls,{lat:place.lat,lon:place.lon,name:place.name},ch,msgMs);
      chain.aiResult=aiResult;chain.heading=arrowBearing;
      const last=chain.points[chain.points.length-1];
      let markerRef=chain.markerRef;
      if(markerRef&&markerRef.marker){
        markerRef.marker.setLatLng([last.lat,last.lon]);
        markerRef.marker.setIcon(makeIcon(cls,arrowBearing,false,confirmN,totalW,null,false,false,false,false,aiResult.level,null,false));
        markerRef.marker.setPopupContent(buildTrailPopupHtml(chain));
      }else{
        const marker=L.marker([last.lat,last.lon],{icon:makeIcon(cls,arrowBearing,false,confirmN,totalW,null,false,false,false,false,aiResult.level,null,false),zIndexOffset:900});
        marker.bindPopup(buildTrailPopupHtml(chain));
        marker.addTo(msgThreatLayer);
        marker.on("popupopen",()=>openTrail(chainKey));
        marker.on("popupclose",()=>closeTrailDrawing(chainKey));
        markerRef={marker,trailPoints:null};chain.markerRef=markerRef;
      }
      msgMarkers.set(key,{marker:markerRef.marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,cls,place,chainKey});
      maybeSirenForPlace(key,cls,place.lat,place.lon);
      continue;
    }
    if(c.kind==="region"||c.kind==="origin"||c.kind==="default"||c.kind==="guess"){
      const{region,cls,stage,origin,target}=c;
      if(!inZone(region.lat,region.lon))continue;
      if(stage==="launch"){
        const targetBearing=target?bearingBetween(region.lat,region.lon,target.lat,target.lon):bearingBetween(region.lat,region.lon,50.45,30.52);
        const fakeThreat={type:cls.type,_altitude:null,_falling:false,_stage:"launch",heading:targetBearing};
        const marker=L.marker([region.lat,region.lon],{icon:makeIcon(fakeThreat,targetBearing,true,confirmN,totalW,null,false,false,false,false,aiResult.level,stage,false),zIndexOffset:950});
        marker.bindPopup(`<div class="popup-title type-${cls.type}">ПУСК · ${cls.label}</div><div>${esc(c.sampleText.slice(0,220))}</div><div class="popup-meta"><b>${esc(origin.name)}</b><br>Курс: ${Math.round(targetBearing)}°${target?`<br>Цель: ${esc(target.name)}`:""}<br>Подтверждений: <b>${confirmN}</b></div>${channelsListHtml(c.channels)}${aiResult?AI.badgeHtml(aiResult):""}`);
        marker.addTo(msgThreatLayer);
        if(msgMarkers.has(key)){const _old=msgMarkers.get(key);if(_old.marker)msgThreatLayer.removeLayer(_old.marker);}
        msgMarkers.set(key,{marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,cls,place:{name:origin.name,lat:region.lat,lon:region.lon},stage:"launch"});
      }else{
        const marker=L.marker([region.lat,region.lon],{icon:launcherIcon(stage,origin.name,confirmN,totalW,aiResult.level),zIndexOffset:940});
        marker.bindPopup(`<div class="popup-title type-launcher">ЗАГРОЗА · ${cls.label}</div><div>${esc(c.sampleText.slice(0,220))}</div><div class="popup-meta"><b>${esc(origin.name)}</b><br>Подтверждений: <b>${confirmN}</b></div>${channelsListHtml(c.channels)}${aiResult?AI.badgeHtml(aiResult):""}`);
        marker.addTo(msgThreatLayer);
        if(msgMarkers.has(key)){const _old=msgMarkers.get(key);if(_old.marker)msgThreatLayer.removeLayer(_old.marker);}
        msgMarkers.set(key,{marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,cls,place:{name:origin.name,lat:region.lat,lon:region.lon},isRegion:true,stage});
      }
      continue;
    }
    if(c.kind==="place"){
      const{place,cls,target,isApproach}=c;
      if(!inZone(place.lat,place.lon)&&!(target&&inZone(target.lat,target.lon)))continue;
      const alt=c.altitudeOverride!=null?c.altitudeOverride:parseAltitude({explanationShort:c.sampleText});
      const falling=isFallingMessage(c.sampleText);
      let hdg=null;
      if(target)hdg=bearingBetween(place.lat,place.lon,target.lat,target.lon);
      else if(!isApproach){
        const{origin,dist}=nearestRussianOrigin(place.lat,place.lon);
        if(origin&&dist>=CONFIG.TRAIL_MIN_ORIGIN_DIST_KM)hdg=bearingBetween(origin.lat,origin.lon,place.lat,place.lon);
      }
      const displayPos=[place.lat,place.lon];
      const speed=resolveSpeedKmh(cls.type,c.sampleText);
      let eta=null;
      if(target&&!isApproach){
        const distKm=haversineKm(displayPos[0],displayPos[1],target.lat,target.lon);
        eta=distKm/speed*60;
      }
      const chainKey=`${cls.type}|${(target&&target.key)||place.key}|${(cls.isGeran5||cls.type==="geran5")?"g5":"std"}`;
      const chain=appendTrailPoint(chainKey,cls,{lat:displayPos[0],lon:displayPos[1],name:(target&&target.name)||place.name,sampleText:c.sampleText},ch,msgMs);
      chain.aiResult=aiResult;chain.heading=hdg;chain.speedKmh=speed;
      const last=chain.points[chain.points.length-1];
      let markerRef=chain.markerRef;
      const inSirenZone=haversineKm(CONFIG.KYIV[0],CONFIG.KYIV[1],place.lat,place.lon)<=CONFIG.SOUND_NEAR_KM;
      if(markerRef&&markerRef.marker){
        markerRef.marker.setLatLng([last.lat,last.lon]);
        markerRef.marker.setIcon(makeIcon(cls,hdg,alt,falling,confirmN,totalW,eta,false,false,false,false,aiResult.level,null,inSirenZone));
        markerRef.marker.setPopupContent(buildTrailPopupHtml(chain));
      }else{
        const marker=L.marker([last.lat,last.lon],{icon:makeIcon(cls,hdg,alt,falling,confirmN,totalW,eta,false,false,false,false,aiResult.level,null,inSirenZone),zIndexOffset:900});
        marker.bindPopup(buildTrailPopupHtml(chain));
        marker.addTo(msgThreatLayer);
        marker.on("popupopen",()=>openTrail(chainKey));
        marker.on("popupclose",()=>closeTrailDrawing(chainKey));
        markerRef={marker,trailPoints:null};chain.markerRef=markerRef;
      }
      const opts={marker:markerRef.marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,alt,falling,hdg,cls,place,targetPlace:target,eta,threat:{type:cls.type,status:"active",_falling:falling},confirmN,totalWeight:totalW,channels:c.channels,heading:hdg,speedKmh:speed,stage:null,stale:false,trail:null,advisory:false,areaOnly:false,uncertain:false,isApproach:!!isApproach,aiLevel:aiResult.level,chainKey,inSirenZone};
      msgMarkers.set(key,opts);
      simulateMovement(opts);
      maybeSirenForPlace(key,cls,place.lat,place.lon);
      continue;
    }
  }

  const nowTs=Date.now();
  for(const[key,chain]of[...trails]){
    if(nowTs-chain.lastSeen>CONFIG.TRAIL_MAX_AGE_MS)closeTrail(key);
  }
  for(const[key,c]of impacts){
    const confirmN=c.channels.size;
    const totalW=totalWeightOf(c.channels);
    if(confirmN<CONFIG.MIN_CHANNELS_CONFIRM)continue;
    if(totalW<2.0)continue;
    const eventAt=c.eventAt||c.lastSeen;
    const age=now-eventAt;
    if(age>CONFIG.IMPACT_TTL_MS){
      if(impactMarkers.has(key)){impactLayer.removeLayer(impactMarkers.get(key).marker);impactMarkers.delete(key);}
      continue;
    }
    if(!inZone(c.target.lat,c.target.lon))continue;
    const t=c.target;
    const aiResult=AI.score({channels:c.channels,firstSeen:eventAt,place:t,cls:null,target:t});
    const marker=L.marker([t.lat,t.lon],{icon:impactSmallIcon(),zIndexOffset:880});
    marker.bindPopup(`<div class="popup-title type-impact">💥 Взрыв / прилёт</div><div>${esc(c.sampleText.slice(0,220))}</div><div class="popup-meta">Місце: <b>${esc(t.name)}</b></div>${channelsListHtml(c.channels)}${aiResult?AI.badgeHtml(aiResult):""}`);
    marker.addTo(impactLayer);
    if(impactMarkers.has(key))impactLayer.removeLayer(impactMarkers.get(key).marker);
    impactMarkers.set(key,{marker,lastSeen:eventAt,eventAt,confirmN,channels:c.channels,aiLevel:aiResult.level,kind:"msg"});
  }
  for(const[key,o]of[...msgMarkers]){
    if(now-o.lastSeen>CONFIG.STALE_MSG_MS){
      if(o.marker)msgThreatLayer.removeLayer(o.marker);
      if(o._simTimer)clearInterval(o._simTimer);
      msgMarkers.delete(key);
    }
  }
  for(const[key,o]of[...impactMarkers]){
    if(o.kind==="msg"&&now-(o.eventAt||o.lastSeen)>CONFIG.IMPACT_TTL_MS){
      impactLayer.removeLayer(o.marker);
      impactMarkers.delete(key);
    }
  }
}

/* ============================================================
   Анимация API-треков
============================================================ */
let rafId=null;
let animRunning=false;
function animate(){
  if(!animRunning)return;
  const now=Date.now();
  for(const tr of tracks.values()){
    if(tr.heading==null)continue;
    if(tr.threat._falling)continue;
    if(tr.threat.areaOnly)continue;
    if(tr.threat.advisory)continue;
    const elapsedH=(now-tr.baseTime)/3600000;
    const capped=Math.min(Math.max(elapsedH,0),CONFIG.EXTRAPOLATION_HOURS);
    const speed=tr.speed||CONFIG.FALLBACK_SPEED[tr.threat.type]||180;
    const distKm=speed*capped;
    const[lat,lon]=destPoint(tr.baseLat,tr.baseLon,tr.heading,distKm);
    tr.marker.setLatLng([lat,lon]);
    if(CONFIG.SOUND_ENABLED&&CONFIG.SOUND_TYPE_FILTER.has(tr.threat.type)){
      const d=haversineKm(CONFIG.KYIV[0],CONFIG.KYIV[1],lat,lon);
      const inZoneNow=d<=CONFIG.SOUND_NEAR_KM;
      if(inZoneNow&&!tr._sirenFired){tr._sirenFired=true;fireSirenForTarget("api:"+tr.threat.id,tr.threat);}
      if(!inZoneNow&&tr._sirenFired){tr._sirenFired=false;}
    }
    const dKyiv=haversineKm(lat,lon,CONFIG.KYIV[0],CONFIG.KYIV[1]);
    if(dKyiv<1&&!tr.arrivalDone){
      tr.arrivalDone=true;
      spawnImpact([lat,lon],{type:tr.threat.type,label:typeLabel(tr.threat)});
      setTimeout(()=>removeThreat(tr.threat.id,true),CONFIG.TARGET_TTL_AFTER_ARRIVAL_MS);
    }
    const last=tr.history[tr.history.length-1];
    if(!last||haversineKm(last.lat,last.lon,lat,lon)>CONFIG.API_TRAIL_MIN_GAP_KM){
      tr.history.push({lat,lon,t:now});
      if(tr.history.length>CONFIG.API_TRAIL_MAX_POINTS)tr.history.shift();
    }
  }
  rafId=requestAnimationFrame(animate);
}
function startAnim(){if(animRunning)return;animRunning=true;rafId=requestAnimationFrame(animate);}
function stopAnim(){animRunning=false;if(rafId){cancelAnimationFrame(rafId);rafId=null;}}

/* ============================================================
   AI-сводка
============================================================ */
function buildSituationSummary(){
  const lines=[];
  if(lastAlerts){
    let kyivAlert=false,oblAlert=false;
    for(const list of[lastAlerts.raions,lastAlerts.oblasts]){
      for(const a of (list||[])){
        const s=String(a.key||"")+" "+String(a.name||"");
        if(/київ(?!ськ)|киев(?!ск)/i.test(s)){if(/обл/i.test(s))oblAlert=true;else kyivAlert=true;}
      }
    }
    if(kyivAlert)lines.push("🔴 Киев: ВОЗДУШНАЯ ТРЕВОГА");
    else if(oblAlert)lines.push("🟠 Киевская область: воздушная тревога");
    else lines.push("🟢 Официальной тревоги в Киеве и области нет");
  }else lines.push("ℹ Нет данных об алертах");
  const warningMarkers=[];
  for(const o of msgMarkers.values())if(o.isWarning&&o.warning)warningMarkers.push(o.warning);
  if(warningMarkers.length>0){
    lines.push("");lines.push(`⚠️ Предупреждений активно: ${warningMarkers.length}`);
    for(const w of warningMarkers)lines.push(`   • ${w.label}`);
  }
  const activeTracks=[...tracks.values()].filter(t=>!t.threat.areaOnly&&!t.threat.advisory);
  lines.push("");
  if(activeTracks.length===0)lines.push("✈ API-треков в зоне: нет");
  else{
    lines.push(`✈ API-треков в зоне: ${activeTracks.length}`);
    const byType={};
    for(const tr of activeTracks)byType[tr.threat.type]=(byType[tr.threat.type]||0)+1;
    for(const[t,n]of Object.entries(byType)){
      const meta=TYPE_META[t];
      lines.push(`   • ${meta?meta.label:t}: ${n}`);
    }
  }
  lines.push("");
  const regularMsgs=[...msgMarkers.values()].filter(o=>!o.isWarning);
  if(regularMsgs.length===0)lines.push("📡 Активных сообщений: нет");
  else{
    lines.push(`📡 Активных сообщений: ${regularMsgs.length}`);
    const byType={};
    for(const o of regularMsgs)if(o.cls)byType[o.cls.type]=(byType[o.cls.type]||0)+1;
    const names={uav:"БПЛА",recon:"Разведка",geran5:"Герань-5",missile:"КР",ballistic:"Баллистика",jet_drone:"Реакт. Герань",banderol:"S8000",mig31k:"МиГ-31К",kab:"КАБ",umpb:"УМПБ",fpv:"FPV",strategic_aviation:"Стратег. авиация",warning:"Предупреждение"};
    for(const[t,n]of Object.entries(byType))lines.push(`   • ${names[t]||t}: ${n}`);
  }
  lines.push("");
  lines.push(`🧩 Цепочек: ${trails.size}`);
  lines.push(`💥 Взрывов за 30 мин: ${impactMarkers.size}`);
  lines.push("");
  let nearest=null,nearestD=Infinity;
  for(const tr of tracks.values()){
    if(tr.threat.areaOnly||tr.threat.advisory)continue;
    const ll=tr.marker.getLatLng();
    const d=haversineKm(CONFIG.KYIV[0],CONFIG.KYIV[1],ll.lat,ll.lng);
    if(d<nearestD){nearestD=d;nearest={src:"api",label:typeLabel(tr.threat),name:tr.threat.locality||tr.threat.region||"—"};}
  }
  for(const o of msgMarkers.values()){
    if(!o.marker||o.isWarning)continue;
    if(o.cls&&(o.cls.isMig||o.cls.isStrategic))continue;
    const ll=o.marker.getLatLng();
    const d=haversineKm(CONFIG.KYIV[0],CONFIG.KYIV[1],ll.lat,ll.lng);
    if(d<nearestD){nearestD=d;nearest={src:"msg",label:o.cls?o.cls.label:"объект",name:o.place?o.place.name:"?"};}
  }
  if(nearest&&nearestD<500){
    const src=nearest.src==="api"?" (API)":"";
    lines.push(`🎯 Ближайшее: ${nearest.label}${src} — ${nearest.name} (${Math.round(nearestD)} км от Киева)`);
  }else lines.push("🎯 В зоне Киева — чисто");
  return lines.join("\n");
}
function showAIExplain(){
  const text=buildSituationSummary();
  const body=$("aiModalBody");
  const title=$("aiModalTitle");
  const icon=$("aiModalIcon");
  if(icon)icon.textContent="🤖";
  if(title)title.textContent="Сводка обстановки · AI Lite";
  body.textContent=text;
  const timeEl=$("aiModalTime");
  if(timeEl)timeEl.textContent="Обновлено: "+new Date().toLocaleTimeString("ru-RU");
  $("aiModalBackdrop").classList.add("show");
}
function hideAIExplain(){$("aiModalBackdrop").classList.remove("show");}
(function initAIModal(){
  const backdrop=$("aiModalBackdrop");
  const closeBtn=$("aiModalClose");
  const copyBtn=$("aiModalCopy");
  if(!backdrop)return;
  backdrop.addEventListener("click",(e)=>{if(e.target===backdrop)hideAIExplain();});
  if(closeBtn)closeBtn.addEventListener("click",hideAIExplain);
  document.addEventListener("keydown",(e)=>{if(e.key==="Escape"&&backdrop.classList.contains("show"))hideAIExplain();});
  if(copyBtn){
    copyBtn.addEventListener("click",async()=>{
      const body=$("aiModalBody");
      if(!body)return;
      try{
        await navigator.clipboard.writeText(body.textContent||"");
        copyBtn.textContent="✅ Скопировано";
        setTimeout(()=>{copyBtn.textContent="📋 Копировать";},1500);
      }catch(e){
        copyBtn.textContent="❌ Не удалось";
        setTimeout(()=>{copyBtn.textContent="📋 Копировать";},1500);
      }
    });
  }
})();

/* ============================================================
   WebSocket + REST
============================================================ */
let ws=null,wsConnected=false,wsReconnectMs=CONFIG.WS_RECONNECT_MS,wsReconnectTimer=null;
let restFallbackActive=false,pollTimer=null,abortCtrl=null;
const wsState={threats:new Map(),alerts:null};
function wsScheduleReconnect(){
  if(wsReconnectTimer)return;
  wsReconnectTimer=setTimeout(()=>{wsReconnectTimer=null;wsConnect();},wsReconnectMs);
  wsReconnectMs=Math.min(wsReconnectMs*2,CONFIG.WS_RECONNECT_MAX_MS);
}
function wsConnect(){
  try{
    if(ws){try{ws.close();}catch{}ws=null;}
    ws=new WebSocket(CONFIG.WS_URL);
    ws.onopen=()=>{wsConnected=true;wsReconnectMs=CONFIG.WS_RECONNECT_MS;restFallbackActive=false;stopRestPolling();updateLiveBadge("ok");};
    ws.onmessage=(e)=>{try{wsHandleFrame(JSON.parse(e.data));}catch(err){}};
    ws.onerror=()=>{};
    ws.onclose=()=>{
      wsConnected=false;ws=null;updateLiveBadge("err");
      if(!restFallbackActive){restFallbackActive=true;startRestPolling();}
      wsScheduleReconnect();
    };
  }catch(e){if(!restFallbackActive){restFallbackActive=true;startRestPolling();}wsScheduleReconnect();}
}
function wsHandleFrame(env){
  if(!env||!env.type)return;
  switch(env.type){
    case "snapshot":{
      const data=env.data||{};
      wsState.threats.clear();
      for(const t of (data.threats||[]))if(t.id)wsState.threats.set(t.id,t);
      if(data.alerts){wsState.alerts=data.alerts;try{syncAlertPolygons(data.alerts);}catch(e){}}
      applyThreatsFromWs();break;
    }
    case "upsert":{const t=env.data;if(t&&t.id){wsState.threats.set(t.id,t);applyThreatsFromWs();}break;}
    case "remove":{const data=env.data||{};if(data.id)wsState.threats.delete(data.id);applyThreatsFromWs();break;}
    case "alerts":{const data=env.data||{};wsState.alerts=data;try{syncAlertPolygons(data);}catch(e){}break;}
  }
}
function applyThreatsFromWs(){try{syncThreats([...wsState.threats.values()]);}catch(e){}}
async function fetchMessages(){
  try{
    const r=await fetch(CONFIG.API_MESSAGES);
    if(!r.ok)throw new Error("messages "+r.status);
    const data=await r.json();
    try{syncMessageThreats(data.messages||[]);}catch(e){}
  }catch(e){}
}
async function fetchThreatsAndAlerts(){
  try{
    if(abortCtrl)abortCtrl.abort();
    abortCtrl=new AbortController();
    const signal=abortCtrl.signal;
    const[tr,al]=await Promise.all([
      fetch(CONFIG.API_THREATS,{signal}).then(r=>{if(!r.ok)throw new Error("threats "+r.status);return r.json();}),
      fetch(CONFIG.API_ALERTS,{signal}).then(r=>{if(!r.ok)throw new Error("alerts "+r.status);return r.json();})
    ]);
    try{syncThreats(tr.threats||[]);}catch(e){}
    try{syncAlertPolygons(al);}catch(e){}
    updateLiveBadge("ok");
  }catch(e){if(e.name!=="AbortError")updateLiveBadge("err");}
}
async function restPollLoop(){
  await fetchThreatsAndAlerts();
  await fetchMessages();
  pollTimer=setTimeout(restPollLoop,CONFIG.POLL_MS);
}
function startRestPolling(){if(pollTimer)clearTimeout(pollTimer);restPollLoop();}
function stopRestPolling(){
  if(pollTimer){clearTimeout(pollTimer);pollTimer=null;}
  if(abortCtrl){abortCtrl.abort();abortCtrl=null;}
}
function updateLiveBadge(state){
  const badge=$("liveBadge");
  if(!badge)return;
  if(state==="ok"){
    badge.textContent=wsConnected?"онлайн · WS":"онлайн";
    badge.className="live-badge live"+(wsConnected?" ws":"");
  }else if(state==="err"){
    badge.textContent="ошибка";badge.className="live-badge stale";
  }
}

/* ============================================================
   UI
============================================================ */
function clearAll(){
  msgMarkers.forEach(o=>{
    if(o.marker)try{msgThreatLayer.removeLayer(o.marker);}catch{}
    if(o._simTimer)clearInterval(o._simTimer);
  });
  msgMarkers.clear();
  impactMarkers.forEach(o=>{if(o.marker)try{impactLayer.removeLayer(o.marker);}catch{}});
  impactMarkers.clear();
  tracks.forEach(tr=>{
    if(tr.marker)try{threatLayer.removeLayer(tr.marker);}catch{}
    if(tr.trailLine)try{map.removeLayer(tr.trailLine);}catch{}
  });
  tracks.clear();
  for(const key of[...trails.keys()])closeTrail(key);
  trails.clear();
}

$("btnRefresh").addEventListener("click",()=>{
  unlockAudio();
  if(wsConnected&&ws){try{ws.close();}catch{}wsConnect();}
  else startRestPolling();
  showToast("Обновление…");
});
$("btnClear").addEventListener("click",()=>{clearAll();showToast("Очищено");});
$("btnAIExplain").addEventListener("click",showAIExplain);

(function initSoundToggle(){
  const btn=$("soundToggle");
  if(!btn)return;
  btn.addEventListener("click",()=>{
    CONFIG.SOUND_ENABLED=!CONFIG.SOUND_ENABLED;
    btn.textContent=CONFIG.SOUND_ENABLED?"🔔 Звук ВКЛ":"🔕 Звук ВЫКЛ";
    btn.className="sound-toggle "+(CONFIG.SOUND_ENABLED?"on":"muted");
    if(CONFIG.SOUND_ENABLED){unlockAudio();showToast("Звук включен");}
    else showToast("Звук выключен");
  });
})();

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){stopRestPolling();stopAnim();}
  else{if(!wsConnected)startRestPolling();startAnim();}
});

/* ============================================================
   СТАРТ
============================================================ */
(async function init(){
  const ctrl=new AbortController();
  loadAlertGeo(ctrl.signal);
  wsConnect();
  fetchMessages();
  setInterval(fetchMessages,5000);
  startAnim();
})();
